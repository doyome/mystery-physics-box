<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0624">
<title>Mystery Physics Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@600;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070418; --ink:#f3f0ff; --mute:#a9a2d6; --cy:#34e7ff; --pk:#ff4fd8; --gd:#ffcc4d; --ok:#3cf2a5; --bad:#ff5577; --vi:#8b5cf6;
  --edge:rgba(255,255,255,.14); --glass:rgba(255,255,255,.06);
  --fd:"Orbitron","Outfit","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --fb:"Outfit","Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --fa:"Cairo","Segoe UI",Tahoma,"Arial",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg0)}
body{font-family:var(--fb);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.35;
  background:radial-gradient(1000px 640px at 88% -12%,rgba(122,52,255,.32),transparent 60%),
             radial-gradient(900px 700px at -12% 112%,rgba(255,79,216,.20),transparent 60%),
             radial-gradient(800px 520px at 50% 45%,rgba(40,24,120,.45),transparent 70%),
             linear-gradient(180deg,#0d0729,#070418);background-attachment:fixed}
html[lang=ar] body{font-family:var(--fa)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
kbd{font:700 11px var(--fb);padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap}
@media (hover:none){kbd,.keys{display:none!important}}

/* bilingual */
.l-en,.l-ar{display:block}
.l-ar{font-family:var(--fa);font-size:.88em;opacity:.93;margin-top:.1em;line-height:1.5}
.ar-i{font-family:var(--fa)}
.sep{opacity:.45;margin:0 .35em}
.eq{font-family:Consolas,"Cascadia Mono","Courier New",monospace;color:var(--gd);background:rgba(255,204,77,.1);padding:0 .35em;border-radius:6px;font-weight:700}

/* ---------- toolbar ---------- */
.tools{position:fixed;top:12px;inset-inline-end:14px;z-index:40;display:flex;gap:8px;align-items:center;transition:opacity .3s,transform .3s}
body.modal-open .tools{opacity:0;pointer-events:none;transform:translateY(-12px)}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(12,7,36,.72);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mute);transition:.25s}
.seg button.sel{background:linear-gradient(135deg,var(--pk),var(--vi));color:#fff;box-shadow:0 4px 16px rgba(255,79,216,.4)}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(12,7,36,.72);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s}
.ib svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.ib:hover{border-color:var(--cy);box-shadow:0 0 16px rgba(52,231,255,.4)}.seg button:not(.sel):hover{color:#fff}}

/* ---------- screens ---------- */
.screen{position:relative;z-index:1;display:none;min-height:100vh;padding:16px 20px 30px}
.screen.on{display:block;animation:scrIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.wrap{max-width:1180px;margin:0 auto}
.wide{max-width:1320px}
.hdr{display:flex;align-items:center;gap:12px;min-height:52px;padding-inline-end:290px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.blogo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:900 24px var(--fd);color:#fff;
  background:linear-gradient(135deg,var(--pk),var(--vi) 55%,var(--cy));box-shadow:0 6px 20px rgba(255,79,216,.45),inset 0 0 0 1px rgba(255,255,255,.35);animation:blogo 4s ease-in-out infinite}
@keyframes blogo{50%{transform:rotate(-6deg) scale(1.05)}}
.bname{font:800 clamp(16px,2vw,22px) var(--fd);letter-spacing:.04em;line-height:1.1}
.bname .l-ar{font-family:var(--fa);letter-spacing:0;font-size:.8em}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--edge);border-radius:24px;padding:18px 20px;
  box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel h3{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px}
.panel h3 .l-ar{display:inline;margin:0}
.lbl{color:var(--mute);font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 8px}
html[lang=ar] .lbl{letter-spacing:0}
.lbl .l-ar{text-transform:none;letter-spacing:0}

/* buttons */
.cta{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:14px 34px;border-radius:999px;font:800 20px var(--fb);color:#fff;
  background:linear-gradient(135deg,#ff4fd8,#8b5cf6 50%,#34e7ff);background-size:200% 200%;box-shadow:0 12px 34px rgba(255,79,216,.38),inset 0 0 0 1px rgba(255,255,255,.35);
  animation:grad 6s ease infinite;transition:transform .2s,box-shadow .2s;overflow:hidden;text-align:center}
.cta .l-ar{font-size:.8em}
.cta:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sheen 3.8s ease-in-out infinite}
@media (hover:hover){.cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 44px rgba(255,79,216,.55)}}
.cta:active{transform:scale(.97)}
@keyframes grad{50%{background-position:100% 50%}}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;background:rgba(255,255,255,.07);border:1px solid var(--edge);transition:.2s}
.ghost.armed{background:rgba(255,85,119,.25);border-color:var(--bad)}
@media (hover:hover){.ghost:hover{background:rgba(255,255,255,.13)}}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:16px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.22);transition:transform .15s,background .2s,box-shadow .2s;text-align:start}
.btn i{font-style:normal;font-size:20px}
.btn .l-ar{font-size:.85em}
.btn.ok{background:linear-gradient(135deg,#25d891,#0fa56b);border-color:#7dffc8;color:#032417;box-shadow:0 5px 0 #076b44}
.btn.no{background:rgba(255,85,119,.16);border-color:var(--bad)}
.btn:active{transform:translateY(3px)}
@media (hover:hover){.btn:hover{transform:translateY(-2px)}}

/* ---------- TITLE ---------- */
#sTitle{display:none;place-items:center;text-align:center;overflow:hidden}
#sTitle.on{display:grid}
.title-wrap{position:relative;z-index:2;max-width:900px;padding:34px 6px 16px}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.floaters span{position:absolute;bottom:-80px;opacity:.16;animation:floatUp linear infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.4))}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(40deg)}}
.logo3d{position:relative;width:200px;height:200px;margin:0 auto 4px}
.hero-art{width:100%;height:100%;overflow:visible;animation:heroF 5s ease-in-out infinite}
@keyframes heroF{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.hero-lid{transform-box:fill-box;transform-origin:50% 100%;animation:lidHop 3.6s ease-in-out infinite}
@keyframes lidHop{0%,64%,100%{transform:none}72%{transform:translateY(-9px) rotate(-3deg)}80%{transform:translateY(-2px) rotate(1deg)}86%{transform:translateY(-5px)}}
.hero-sp{animation:twk 2.4s ease-in-out infinite}
@keyframes twk{50%{opacity:.35}}
.cube{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px;transform-style:preserve-3d;animation:spin 14s linear infinite}
.cube b{position:absolute;inset:0;display:grid;place-items:center;font:900 54px var(--fd);color:#fff;border-radius:16px;
  background:linear-gradient(135deg,rgba(255,79,216,.28),rgba(52,231,255,.18));border:2px solid rgba(255,255,255,.75);
  box-shadow:inset 0 0 26px rgba(255,79,216,.7),0 0 20px rgba(52,231,255,.55);text-shadow:0 0 16px var(--pk)}
.cube .f1{transform:translateZ(52px)}.cube .f2{transform:rotateY(180deg) translateZ(52px)}.cube .f3{transform:rotateY(90deg) translateZ(52px)}
.cube .f4{transform:rotateY(-90deg) translateZ(52px)}.cube .f5{transform:rotateX(90deg) translateZ(52px)}.cube .f6{transform:rotateX(-90deg) translateZ(52px)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.orbit{position:absolute;inset:6px;border:1.5px solid rgba(52,231,255,.4);border-radius:50%;--b:rotateX(74deg);transform:var(--b);animation:orb 5s linear infinite}
.orbit i{position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--cy);box-shadow:0 0 16px var(--cy)}
.orbit.o2{--b:rotateY(62deg) rotateX(74deg);border-color:rgba(255,79,216,.4);animation-duration:8s}
.orbit.o2 i{background:var(--pk);box-shadow:0 0 16px var(--pk)}
@keyframes orb{from{transform:var(--b) rotateZ(0)}to{transform:var(--b) rotateZ(360deg)}}
.cube-glow{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,216,.55),transparent 66%);filter:blur(18px);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.mega{font:900 clamp(30px,5.6vw,70px) var(--fd);letter-spacing:.03em;margin:4px 0 8px;line-height:1.04;text-transform:uppercase;
  background:linear-gradient(90deg,#fff 0%,var(--cy) 25%,var(--pk) 50%,var(--gd) 75%,#fff 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s linear infinite;filter:drop-shadow(0 0 26px rgba(255,79,216,.35))}
.mega .l-ar{font-family:var(--fa);font-weight:800;letter-spacing:0;font-size:.62em;margin-top:.15em}
html[lang=ar] .mega{font-family:var(--fa);letter-spacing:0;line-height:1.3}
@keyframes shimmer{to{background-position:300% 0}}
.tagline{font-size:clamp(16px,2vw,21px);color:#d8d2ff;margin:0 0 18px;letter-spacing:.04em}
.tagline .l-ar{letter-spacing:0}
.credit{position:relative;margin:20px auto 0;max-width:780px;padding:14px 22px 14px;border-radius:20px;text-align:center;
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--edge);color:#e2ddff;font-size:15.5px;line-height:1.6;
  box-shadow:0 14px 40px rgba(0,0,0,.3)}
.credit .ribbon{display:inline-block;margin-bottom:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1a0b33;background:linear-gradient(90deg,var(--gd),#ffe69a)}
html[lang=ar] .credit .ribbon{letter-spacing:0}
.credit .ribbon{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 7px;max-width:100%}
.credit .ribbon [lang=ar]{font-family:var(--fa);letter-spacing:0;font-size:1.05em}
.credit .rsep{opacity:.6}
.credit b{color:var(--gd);white-space:nowrap}
.credit .cl{display:block}
.credit .cl+.cl{margin-top:2px}
.credit .dash{opacity:.5;margin:0 .35em}
.title-keys{margin-top:14px;color:var(--mute);font-size:13px}

/* ---------- SETUP ---------- */
.h2{font:800 clamp(24px,3vw,34px) var(--fd);margin:4px 0 14px;letter-spacing:.02em}
.h2 .l-ar{font-family:var(--fa);letter-spacing:0;font-size:.72em}
html[lang=ar] .h2{font-family:var(--fa)}
.rulecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.rc{position:relative;padding:14px 14px 14px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--edge);font-size:14.5px;line-height:1.45;animation:rise .6s both}
.rc .ri{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;margin-bottom:8px;background:linear-gradient(135deg,rgba(255,79,216,.35),rgba(139,92,246,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.rc b{color:var(--gd)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.setup{display:grid;gap:16px;grid-template-columns:1.1fr 1fr}
@media(max-width:900px){.setup{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-width:48px;min-height:46px;padding:8px 14px;border-radius:14px;font-weight:800;font-size:16px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);transition:.2s}
.opt.sel{background:linear-gradient(135deg,var(--gd),#ffa94d);color:#2a1600;border-color:transparent;box-shadow:0 6px 18px rgba(255,204,77,.35)}
.opt:disabled{opacity:.3;cursor:not-allowed}
.modeseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeseg button{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border-radius:16px;font-weight:800;font-size:17px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);text-align:start;transition:.25s}
.modeseg button i{font-style:normal;font-size:26px}
.modeseg button.sel{background:linear-gradient(135deg,rgba(255,79,216,.35),rgba(139,92,246,.35));border-color:var(--pk);box-shadow:0 0 22px rgba(255,79,216,.3)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.names{grid-template-columns:1fr}}
.nrow{display:flex;align-items:center;gap:8px}
.nav{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.07);border:1.5px solid var(--c)}
.names input,.tcard input{flex:1;min-width:0;width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:rgba(8,4,26,.6);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:.2s}
.names input:focus,.tcard input:focus{border-color:var(--c,var(--cy));box-shadow:0 0 0 3px rgba(52,231,255,.18)}
input::placeholder{color:#8e87b8}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.tcards{grid-template-columns:1fr}}
.tcard{padding:10px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-top:3px solid var(--c)}
.tcard .tn{font-weight:700}
.mems{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.mems input{min-height:44px;font-size:14px;padding:8px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.topic{position:relative;display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 12px;border-radius:16px;font-weight:700;font-size:14.5px;text-align:start;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);transition:.2s}
.topic i{font-style:normal;font-size:22px}
.topic span{flex:1;line-height:1.25}
.topic span .l-ar{font-size:.86em}
.topic em{font-style:normal;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.topic.sel{border-color:var(--cy);background:linear-gradient(135deg,rgba(52,231,255,.22),rgba(139,92,246,.2));box-shadow:0 0 20px rgba(52,231,255,.25)}
.topic.star:not(.sel){border-style:dashed;border-color:rgba(255,204,77,.6)}
.switch{display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);font-weight:800}
.switch i{position:relative;width:54px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);transition:.3s}
.switch i:after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.3s}
.switch.on i{background:linear-gradient(90deg,var(--ok),var(--cy))}
.switch.on i:after{inset-inline-start:26px}
.hint{color:var(--mute);font-size:13.5px;margin-top:6px}
.startbar{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 6px}
.startbar .cta{min-width:min(420px,100%)}
.keys{color:var(--mute);font-size:13px;text-align:center}

/* ---------- BOARD ---------- */
.turnbar{--c:#34e7ff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;border-radius:24px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--cg,rgba(52,231,255,.2)),rgba(255,255,255,.03) 70%);border:1px solid var(--edge);animation:rise .5s both}
.tav{flex:0 0 auto;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.08);border:2px solid var(--c);box-shadow:0 0 22px var(--cg);animation:avPulse 2.4s ease-in-out infinite}
.tav.sm{width:46px;height:46px;font-size:24px;border-radius:14px}
@keyframes avPulse{50%{box-shadow:0 0 34px var(--c)}}
.tinfo{min-width:0}
.tsmall{color:var(--mute);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
html[lang=ar] .tsmall{letter-spacing:0}
.tname{font-weight:800;font-size:clamp(19px,2.2vw,26px);line-height:1.15}
.tname.sm{font-size:18px}
.tname .l-ar{font-size:.8em}
.members{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.members span{padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600}
.fire{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;color:#2a1000;background:linear-gradient(90deg,#ffd166,#ff8a3d);box-shadow:0 0 16px rgba(255,138,61,.6);animation:fireP 1.2s ease-in-out infinite}
@keyframes fireP{50%{transform:scale(1.08)}}
.thint{margin-inline-start:auto;font-weight:800;color:var(--gd);text-align:center;animation:pulseTxt 2.2s ease-in-out infinite}
@keyframes pulseTxt{50%{opacity:.6}}
.tleft{display:flex;flex-direction:column;align-items:center;padding:6px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--edge);text-align:center;font-size:12px;color:var(--mute);font-weight:700}
.tleft b{font:900 28px var(--fb);color:#fff}
.bgrid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media(max-width:940px){.bgrid{grid-template-columns:1fr}}
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
@media(max-width:560px){.board{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:380px){.board{grid-template-columns:repeat(2,1fr)}}
.mbox{--tc:#34e7ff;position:relative;aspect-ratio:1/1.04;border-radius:22px;padding:0;min-height:96px;
  transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .25s ease-out,filter .3s}
.board.intro .mbox{animation:boxIn .7s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(var(--d) * 50ms)}
@keyframes boxIn{from{opacity:0;transform:translateY(40px) scale(.7) rotate(-6deg)}}
.mface{position:absolute;inset:0;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#43289e 0%,#24156a 50%,#160d45 100%);
  box-shadow:inset 0 0 0 1.5px var(--tcg),0 14px 30px rgba(0,0,0,.5),0 0 22px var(--tcs);transition:box-shadow .3s}
.mface:before{content:"";position:absolute;left:0;right:0;top:0;height:27%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border-bottom:2px solid var(--tcg);transition:transform .3s}

}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;line-height:1.15;

  transition:transform .8s cubic-bezier(.3,1.35,.5,1),background .3s,box-shadow .3s}

/* ---------- PLAY MODAL ---------- */
.modal{position:fixed;inset:0;z-index:30;display:none;overflow:auto;padding:12px 12px 26px;-webkit-overflow-scrolling:touch;

  background:linear-gradient(160deg,rgba(46,27,122,.8),rgba(14,8,40,.92));border:1px solid var(--edge);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1),0 0 70px rgba(139,92,246,.25);animation:modalIn .55s cubic-bezier(.2,.9,.25,1.2)}

.timer .trk{stroke:rgba(255,255,255,.12)}
.timer .arc{stroke:url(#tg);stroke-linecap:round;transition:stroke-dashoffset 1s linear}

.timer.crit{animation:tpulse .5s ease-in-out infinite}
@keyframes tpulse{50%{transform:scale(1.12);filter:drop-shadow(0 0 14px var(--bad))}}
.stage{display:grid;grid-template-columns:340px 1fr;gap:16px}

.specimen{--tc:#34e7ff;--tcg:rgba(52,231,255,.4);position:relative;height:290px;border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 92%,var(--tcg),transparent 55%),radial-gradient(circle at 50% 0%,rgba(255,255,255,.14),transparent 50%),linear-gradient(180deg,#160c44,#0a0624);
  border:1px solid var(--edge);box-shadow:inset 0 0 60px rgba(0,0,0,.6)}

.rays{position:absolute;left:50%;top:44%;width:620px;height:620px;margin:-310px 0 0 -310px;opacity:0;transform:scale(.2);pointer-events:none}

  -webkit-mask:radial-gradient(circle,#000 0,#000 12%,transparent 60%);mask:radial-gradient(circle,#000 0,#000 12%,transparent 60%);animation:raysSpin 22s linear infinite}
.specimen.open .rays{animation:raysIn 1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes raysIn{to{opacity:1;transform:scale(1)}}
@keyframes raysSpin{to{transform:rotate(360deg)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff,transparent 62%);opacity:0;pointer-events:none;z-index:6}
.specimen.open .flash{animation:flash .9s ease-out}
@keyframes flash{15%{opacity:.95}100%{opacity:0}}
.pedestal{position:absolute;left:50%;bottom:30px;width:230px;height:40px;margin-left:-115px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.35),var(--tcg) 40%,transparent 70%);box-shadow:0 0 50px var(--tcg)}

.cbody{position:absolute;left:0;right:0;bottom:0;height:114px;border-radius:12px 12px 18px 18px;z-index:2;display:grid;place-items:center;
  background:linear-gradient(180deg,#5534c4,#2a1670);box-shadow:inset 0 0 0 2px var(--tc),0 0 30px var(--tcg),0 18px 26px rgba(0,0,0,.55);
  font:900 60px var(--fd);color:#fff;text-shadow:0 0 18px var(--tc);transition:transform .7s cubic-bezier(.5,0,.7,.4),opacity .6s}
.cbody:before{content:"";position:absolute;inset:12px;border:1.5px dashed rgba(255,255,255,.3);border-radius:10px}

  background:linear-gradient(180deg,#7a55f0,#3e23a0);box-shadow:inset 0 0 0 2px var(--tc),0 0 22px var(--tcg);transform-origin:0 100%;
  transition:transform .8s cubic-bezier(.3,1.5,.5,1),opacity .8s}
.clid:after{content:"";position:absolute;left:50%;top:-9px;width:44px;height:10px;margin-left:-22px;border-radius:8px 8px 0 0;background:var(--tc);box-shadow:0 0 12px var(--tc)}
.specimen:not(.open) .clid{animation:rattle 2.6s ease-in-out infinite}
@keyframes rattle{0%,70%,100%{transform:none}75%{transform:translateY(-6px) rotate(-3deg)}80%{transform:translateY(-2px) rotate(2deg)}85%{transform:translateY(-5px) rotate(-1deg)}}

.sparks i{position:absolute;left:50%;top:48%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--tc),0 0 4px #fff;z-index:5;animation:spk 1.1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes spk{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
/* hologram */
.holo{position:relative;display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-radius:22px;overflow:hidden;min-height:112px;
  background:linear-gradient(135deg,rgba(10,52,90,.65),rgba(28,12,74,.65));border:1px solid rgba(52,231,255,.5);box-shadow:inset 0 0 34px rgba(52,231,255,.15),0 0 26px rgba(52,231,255,.15)}

.holo:after{content:"";position:absolute;top:-40%;bottom:-40%;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(52,231,255,.14),transparent);transform:skewX(-20deg);animation:hsweep 5s ease-in-out infinite;pointer-events:none}
@keyframes scan{to{background-position:0 100px}}
@keyframes hsweep{0%,40%{left:-40%}100%{left:140%}}
.avatar{position:relative;flex:0 0 80px;height:88px;animation:hov 3s ease-in-out infinite}
@keyframes hov{50%{transform:translateY(-4px)}}
.avatar svg{width:80px;height:80px;overflow:visible;filter:drop-shadow(0 0 10px rgba(52,231,255,.7));animation:flick 6s infinite}

.avatar .beam{position:absolute;left:14px;right:14px;bottom:-6px;height:16px;background:radial-gradient(ellipse,rgba(52,231,255,.6),transparent 70%);filter:blur(2px)}
.r1{transform-origin:50px 50px;animation:rot 9s linear infinite}
.r2{transform-origin:50px 50px;animation:rot 6s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}

@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth{transform-origin:50px 62px;transition:transform .2s}
.holo.talking .mouth{animation:talk .16s infinite alternate}
@keyframes talk{to{transform:scaleY(3.2) scaleX(.8)}}
.htext{position:relative;z-index:1;flex:1;min-width:0}
.hname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:800 12px var(--fd);letter-spacing:.16em;color:var(--cy);margin-bottom:5px}

/* flip cards */
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.front b{display:block;font-size:17px}

.back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(255,204,77,.18),rgba(255,79,216,.12));border:1.5px solid rgba(255,204,77,.6);font-size:16px;line-height:1.45}

.next{width:100%;margin-top:14px}

.mc{--c:#fff;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:14px;font-weight:600}
.mc .a{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:1.5px solid var(--c)}
.mc b{font:900 17px var(--fb)}
.mc.turn{border-color:var(--c);box-shadow:0 0 14px var(--cg)}

.float{position:fixed;z-index:95;pointer-events:none;font:900 54px var(--fd);text-shadow:0 0 24px currentColor,0 4px 0 rgba(0,0,0,.4);animation:floatUpT 1.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes floatUpT{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-30px) scale(1.2);opacity:1}100%{transform:translate(-50%,-150px) scale(1);opacity:0}}
.combo{--c:#ffcc4d;position:fixed;left:50%;top:36%;z-index:96;pointer-events:none;text-align:center;transform:translate(-50%,-50%);animation:comboIn 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
.combo b{display:block;font:900 clamp(44px,8vw,92px) var(--fd);background:linear-gradient(90deg,#ffd166,#ff8a3d,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,138,61,.8))}
.combo > span{display:inline-block;margin-top:4px;padding:5px 16px;border-radius:999px;background:rgba(0,0,0,.5);border:1.5px solid var(--c);font-weight:800;font-size:18px}
@keyframes comboIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.1) rotate(2deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-70%) scale(.9);opacity:0}}

/* ---------- END ---------- */

.drum .l-ar{font-family:var(--fa);font-size:.7em}
.drum.on{display:block}
@keyframes drumP{to{transform:scale(1.06);text-shadow:0 0 30px var(--pk)}}
.endt{font:900 clamp(28px,5vw,58px) var(--fd);margin:24px 0 2px;line-height:1.15;opacity:0}
.endt.on{animation:champIn .9s cubic-bezier(.2,1.4,.4,1) forwards}
.endt .l-ar{font-family:var(--fa);font-size:.7em}
html[lang=ar] .endt{font-family:var(--fa)}
@keyframes champIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.endsub{color:var(--mute);font-weight:700;letter-spacing:.08em;opacity:0;transition:opacity .6s .4s}
.endsub.on{opacity:1}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:22px auto 8px;min-height:330px;max-width:680px}
.pcol{--c:#fff;flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(80px)}
.pcol.up{animation:podUp .9s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes podUp{to{opacity:1;transform:none}}
.pav{position:relative;width:76px;height:76px;border-radius:24px;font-size:40px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2.5px solid var(--c);box-shadow:0 0 34px var(--cg)}

.pnm{font-weight:800;font-size:18px;margin:8px 0 0;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.pnm .l-ar{font-size:.85em}

{i:"🎵",c:"wave",n:["Tuning fork","شوكة رنّانة"],

{i:"🌀",c:"mech",n:["Spring","نابض (زنبرك)"],

{i:"🕰️",c:"mech",n:["Pendulum","بندول"],

{i:"🎱",c:"mech",n:["Newton's cradle","مهد نيوتن"],

{i:"🧊",c:"therm",n:["Ice on metal & wood","ثلج على معدن وخشب"],

{i:"🌡️",c:"therm",n:["Thermometer","ميزان الحرارة"],

let G=null, cur=null, opening=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=s=>s.replace(/⟦(.+?)⟧/g,'<bdi class="eq">$1</bdi>');
const strip=s=>s.replace(/[⟦⟧]/g,"");
function dual(en,ar){return `<span class="l-en">${fm(en)}</span><span class="l-ar" lang="ar" dir="rtl">${fm(ar)}</span>`}
function L(a){return lang==="both"?dual(a[0],a[1]):fm(lang==="ar"?a[1]:a[0])}
function Li(a){return lang==="both"?`${a[0]}<span class="sep">·</span><span class="ar-i" lang="ar" dir="rtl">${a[1]}</span>`:(lang==="ar"?a[1]:a[0])}
function P(a){return lang==="both"?a[0]+" / "+a[1]:(lang==="ar"?a[1]:a[0])}
const tx=k=>L(U[k]), txi=k=>Li(U[k]), tp=k=>P(U[k]);
function pName(p,stack){return p.name?`<span class="one" dir="auto">${esc(p.name)}</span>`:(stack?L(p.def):Li(p.def))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(id){const f=FILTERS.find(x=>x.id===id)||FILTERS[0];return ITEMS.filter(it=>!f.cats||f.cats.includes(it.c))}
function chip(c){const k=CAT[c];return `<span class="chip" style="--cc2:${k.col}40;--cc3:${k.col}aa"><i>${k.ic}</i><span>${L(k.n)}</span></span>`}
function membersHTML(p){return p.members.length?`<div class="members">${p.members.map(m=>`<span dir="auto">👩‍🔬 ${esc(m)}</span>`).join("")}</div>`:""}

  const h=document.documentElement;
  h.lang=lang==="ar"?"ar":"en"; h.dir=lang==="ar"?"rtl":"ltr";
  document.body.classList.toggle("both",lang==="both");
  document.querySelectorAll("[data-t]").forEach(el=>el.innerHTML=tx(el.dataset.t));
  document.querySelectorAll("[data-ti]").forEach(el=>el.innerHTML=txi(el.dataset.ti));
  document.querySelectorAll("[data-tt]").forEach(el=>{el.title=tp(el.dataset.tt);el.setAttribute("aria-label",tp(el.dataset.tt))});
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("sel",b.dataset.l===lang));
  document.title=tp("title");

  renderSetup(); renderSnd();
  if(G){renderBoard(); if(cur) renderPlay(false); if($("sEnd").classList.contains("on")) renderEnd(false)}
}

/* ============================== SETUP ============================== */
function setCfg(k,v){cfg[k]=v;sfx.click();renderSetup()}
function renderSetup(){
  const isT=cfg.mode==="team", n=isT?cfg.nTeam:cfg.nInd;
  $("modeSeg").innerHTML=[["ind","modeInd","👤"],["team","modeTeam","👥"]].map(([v,k,ic])=>
    `<button class="${cfg.mode===v?"sel":""}" onclick="setCfg('mode','${v}')"><i>${ic}</i><span>${tx(k)}</span></button>`).join("");
  $("countLbl").innerHTML=txi(isT?"nTeam":"nInd");
  const range=isT?[2,3,4,5,6]:[2,3,4,5,6,7,8], key=isT?"nTeam":"nInd";
  $("countRow").innerHTML=range.map(v=>`<button class="opt ${v===n?"sel":""}" onclick="setCfg('${key}',${v})">${v}</button>`).join("");
  if(!isT){
    $("names").innerHTML=`<div class="names">`+Array.from({length:n},(_,i)=>
      `<label class="nrow" style="--c:${COLORS[i]}"><span class="nav">${AVS[i]}</span><input dir="auto" maxlength="24" value="${esc(indNames[i])}" placeholder="${esc(lang==="ar"?indDef(i)[1]:indDef(i)[0])}" oninput="indNames[${i}]=this.value"></label>`).join("")+`</div>`;
  }else{
    $("names").innerHTML=`<div class="tcards">`+Array.from({length:n},(_,i)=>
      `<div class="tcard" style="--c:${COLORS[i]}"><label class="nrow"><span class="nav">${AVS[i]}</span><input class="tn" dir="auto" maxlength="24" value="${esc(teams[i].name)}" placeholder="${esc(lang==="ar"?TEAM_DEF[i][1]:TEAM_DEF[i][0])}" oninput="teams[${i}].name=this.value"></label>
       <div class="mems">${[0,1,2].map(j=>`<input dir="auto" maxlength="20" value="${esc(teams[i].m[j])}" placeholder="${esc(lang==="ar"?U.member[1]:U.member[0])} ${j+1}" oninput="teams[${i}].m[${j}]=this.value">`).join("")}</div></div>`).join("")+`</div>`;
  }
  $("topics").innerHTML=FILTERS.map(f=>`<button class="topic ${f.star?"star":""} ${cfg.topic===f.id?"sel":""}" onclick="setCfg('topic','${f.id}')"><i>${f.ic}</i><span>${L(f.n)}</span><em>${pool(f.id).length}</em></button>`).join("");
  const avail=pool(cfg.topic).length;
  const opts=[...new Set([6,8,12,16,20,avail])].filter(v=>v<=avail).sort((a,b)=>a-b);
  if(!opts.includes(cfg.boxes)){const lower=opts.filter(v=>v<=cfg.boxes);cfg.boxes=lower.length?lower[lower.length-1]:opts[0]}
  $("boxRow").innerHTML=opts.map(v=>`<button class="opt ${v===cfg.boxes?"sel":""}" onclick="setCfg('boxes',${v})">${v}</button>`).join("");
  $("timerRow").innerHTML=[0,30,45,60,90].map(v=>`<button class="opt ${v===cfg.timer?"sel":""}" onclick="setCfg('timer',${v})">${v?v+(lang==="ar"?" ث":"s"):Li(U.off)}</button>`).join("");
  $("stealBox").innerHTML=`<button class="switch ${cfg.steal?"on":""}" onclick="setCfg('steal',${!cfg.steal})"><i></i><span>${Li(cfg.steal?U.on:U.offS)}</span></button>`;
}
function toSetup(){ac();sfx.whoosh();show("sSetup")}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
  window.scrollTo(0,0);
}

/* ============================== GAME ============================== */
function startGame(){
  ac(); save();
  const isT=cfg.mode==="team", n=isT?cfg.nTeam:cfg.nInd;
  const players=Array.from({length:n},(_,i)=>({
    name:((isT?teams[i].name:indNames[i])||"").trim()||null,
    def:isT?TEAM_DEF[i]:indDef(i),
    members:isT?teams[i].m.map(s=>s.trim()).filter(Boolean):[],
    color:COLORS[i], av:AVS[i], score:0, streak:0, best:0
  }));
  const picks=shuffle(pool(cfg.topic)).slice(0,cfg.boxes);
  G={players,boxes:picks.map(it=>({it,done:false,by:-1,order:shuffle([0,1,2,3])})),turn:0};
  cur=null; opening=false; clearEndTimers();
  $("lb").innerHTML="";
  show("sBoard"); renderBoard(true); sfx.start();
}
function renderBoard(intro){
  if(!G) return;
  const p=G.players[G.turn], left=G.boxes.filter(b=>!b.done).length;
  const tb=$("turnbar"); tb.style.setProperty("--c",p.color); tb.style.setProperty("--cg",p.color+"55");
  tb.innerHTML=`<div class="tav">${p.av}</div><div class="tinfo"><div class="tsmall">${txi("turnNow")}</div><div class="tname">${pName(p)}</div>${membersHTML(p)}</div>
    ${p.streak>=2?`<span class="fire">🔥 ×${p.streak}</span>`:""}<div class="thint">👆 ${tx("pickBox")}</div><div class="tleft"><b>${left}</b>${tx("left")}</div>`;
  const bd=$("board");
  bd.innerHTML=G.boxes.map((b,i)=>{const c=CAT[b.it.c];
    return `<button class="mbox ${b.done?"done":""}" style="--d:${i};--tc:${c.col};--tcg:${c.col}99;--tcs:${c.col}33" onclick="openBox(${i})" ${b.done?'tabindex="-1" aria-disabled="true"':""}>
      <div class="mface"><span class="mnum">${String(i+1).padStart(2,"0")}</span>
      ${b.done?`<span class="mico">${artOf(b.it)}</span><span class="mname">${L(b.it.n)}</span>`:`<span class="mq">${CRATE}</span>${chip(b.it.c)}`}
      ${b.by>=0?`<span class="who" style="--c:${G.players[b.by].color}"></span>`:""}</div></button>`}).join("");
  if(intro){bd.classList.add("intro");setTimeout(()=>bd.classList.remove("intro"),2200)}
  renderLB();
}
function renderLB(){
  const el=$("lb"), P=G.players, n=P.length, rowH=lang==="both"?66:56;
  if(el.children.length!==n||el.dataset.lang!==lang){
    el.innerHTML=P.map((p,i)=>`<div class="lbr" style="--c:${p.color}"><span class="rk"></span><span class="av">${p.av}</span><div class="nmw"><div class="nm"></div><div class="bar"><i></i></div></div><span class="pt">${p.score}</span></div>`).join("");
    el.dataset.lang=lang;
  }
  const order=P.map((_,i)=>i).sort((a,b)=>P[b].score-P[a].score||a-b), max=Math.max(1,...P.map(p=>p.score));
  let prevR=0;
  order.forEach((pi,rank)=>{
    const row=el.children[pi], p=P[pi];
    row.style.transform=`translateY(${rank*rowH}px)`; row.style.height=(rowH-6)+"px";
    row.classList.toggle("turn",pi===G.turn);
    const r=rank>0&&p.score===P[order[rank-1]].score?prevR:rank+1; prevR=r;
    row.querySelector(".rk").textContent=r==1?"🥇":r==2?"🥈":r==3?"🥉":r;
    row.querySelector(".nm").innerHTML=pName(p,true)+(p.streak>=2?`<span class="fire">🔥×${p.streak}</span>`:"");
    row.querySelector(".bar i").style.width=(p.score/max*100)+"%";
    const pt=row.querySelector(".pt");
    if(pt.textContent!==String(p.score)){pt.textContent=p.score;pt.classList.remove("bump");void pt.offsetWidth;pt.classList.add("bump")}
  });
  el.style.height=n*rowH+"px";
}
let finArm=0,finT=null;
function finishAsk(){
  const b=$("finBtn");
  if(Date.now()-finArm<3000){finArm=0;clearTimeout(finT);b.classList.remove("armed");b.innerHTML=tx("finish");endGame();return}
  finArm=Date.now(); b.innerHTML=tx("finishSure"); b.classList.add("armed"); sfx.click();
  clearTimeout(finT); finT=setTimeout(()=>{b.classList.remove("armed");b.innerHTML=tx("finish")},3000);
}

/* ---------- play modal ---------- */
function openBox(i){
  if(!G||opening||cur) return;
  const b=G.boxes[i]; if(!b||b.done) return;
  opening=true; sfx.click();
  const el=$("board").children[i]; if(el) el.classList.add("opening");
  setTimeout(()=>{
    opening=false;
    cur={i,b,phase:"ask",wrong:[],scorer:-1,stealer:-1,touch:false,look:false,whyShown:false,bonusDone:false,bonusYes:false,timeout:false,outcome:"",tLeft:0,tTotal:0};
    renderPlay(true);
    document.body.classList.add("modal-open");
    $("mPlay").classList.add("on"); $("mPlay").scrollTop=0;
    typeAI(true); startTimer(cfg.timer); sfx.whoosh();
    if(el) el.classList.remove("opening");
  },280);
}
function renderPlay(first){
  const b=cur.b, it=b.it, P=G.players, p=P[G.turn], done=cur.phase==="done", c=CAT[it.c];
  $("pNo").textContent="#"+String(cur.i+1).padStart(2,"0");
  $("pTopic").innerHTML=chip(it.c);
  const w=$("pWho"); w.style.setProperty("--c",p.color); w.style.setProperty("--cg",p.color+"55");
  w.innerHTML=`<div class="tav sm">${p.av}</div><div class="tinfo"><div class="tname sm">${pName(p)}</div>${membersHTML(p)}</div>`;
  const sp=$("spec"); sp.style.setProperty("--tc",c.col); sp.style.setProperty("--tcg",c.col+"66");
  if(first){sp.className="specimen";$("crItem").innerHTML=artOf(it);$("sparks").innerHTML=""}
  $("objName").innerHTML=done?L(it.n):"";
  $("hname").innerHTML=`<span class="live"></span>NOVA<span class="hsub">${Li(U.aiSub)}</span>`;
  if(!first) typeAI(false);
  renderClues(first);
  renderSteal();
  $("qline").innerHTML=tx("question");
  $("choices").innerHTML=b.order.map((k,pos)=>{
    let cls="ch"; const isW=cur.wrong.includes(k);
    if(done) cls+=k===0?" right":isW?" wrong":" dim"; else if(isW) cls+=" wrong";
    return `<button class="${cls}" data-k="${k}" onclick="answer(${k})" ${done||isW?"disabled":""}><span class="num">${pos+1}</span><span class="ct">${L(it.o[k])}</span></button>`}).join("");
  $("backBtn").style.display=cur.phase==="ask"&&!cur.wrong.length?"":"none";
  renderResult(); renderMini();
}
function renderClues(first){
  [["touch","fTouch","✋"],["look","fLook","👁️"]].forEach(([k,id,ic],n)=>{
    const f=$(id);
    f.querySelector(".fi").innerHTML=`<div class="ff front"><span class="big">${ic}</span><span><b>${tx(k)}</b><small>${tx("tap")}</small></span><kbd>${n?"L":"T"}</kbd></div>
      <div class="ff back"><h4>${ic} ${L(U[k])}</h4>${L(cur.b.it[k==="touch"?"t":"l"])}</div>`;
    f.classList.toggle("on",!!cur[k]);
  });
}
let typeH=null;
function stopTyping(){clearInterval(typeH);typeH=null;$("holo").classList.remove("talking")}
const q=sg=>(sg[0]==="l-ar"||lang==="ar")?"«"+strip(sg[1])+"»":"“"+strip(sg[1])+"”";
function typeAI(animate){
  stopTyping();
  const a=cur.b.it.a, el=$("aiText");
  const segs=lang==="both"?[["l-en",a[0]],["l-ar",a[1]]]:[["",lang==="ar"?a[1]:a[0]]];
  el.innerHTML=segs.map(([c])=>`<span class="${c}" ${c==="l-ar"||lang==="ar"?'lang="ar" dir="rtl"':""}></span>`).join("");
  const spans=[...el.children];
  if(!animate){spans.forEach((s,i)=>s.textContent=q(segs[i]));return}
  let si=0,k=0; $("holo").classList.add("talking");
  typeH=setInterval(()=>{
    const s=spans[si], t=q(segs[si]); k++;
    s.textContent=t.slice(0,k); s.classList.add("cur"); if(k%3===0) sfx.blip();
    if(k>=t.length){s.classList.remove("cur");si++;k=0;if(si>=spans.length) stopTyping()}
  },30);
}
function clue(kind){
  if(!cur||cur[kind]) return;
  cur[kind]=true; $(kind==="touch"?"fTouch":"fLook").classList.add("on"); sfx.flip();
}
let tH=null;
function startTimer(sec){
  clearInterval(tH); cur.tTotal=sec; cur.tLeft=sec; drawT();
  if(!sec) return;
  tH=setInterval(()=>{
    if(!cur){clearInterval(tH);return}
    cur.tLeft--; drawT();
    if(cur.tLeft<=5&&cur.tLeft>0) sfx.tick();
    if(cur.tLeft<=0){clearInterval(tH);timeUp()}
  },1000);
}
function stopTimer(){clearInterval(tH)}
function drawT(){
  const w=$("timer");
  if(!cur.tTotal||cur.phase==="done"){w.style.display="none";return}
  w.style.display=""; $("tNum").textContent=cur.tLeft;
  $("tArc").style.strokeDashoffset=213.6*(1-cur.tLeft/cur.tTotal);
  w.classList.toggle("warn",cur.tLeft<=10); w.classList.toggle("crit",cur.tLeft<=5);
}
function timeUp(){
  if(!cur) return;
  if(cur.phase==="ask") answer(-1);
  else if(cur.phase==="steal"){cur.outcome=cur.timeout?"timeUp":"wrong";finish()}
}
function answerPos(pos){if(cur){const k=cur.b.order[pos];if(k!==undefined) answer(k)}}
function answer(k){
  if(!cur||(cur.phase!=="ask"&&cur.phase!=="steal")) return;
  if(k>=0&&cur.wrong.includes(k)) return;
  stopTimer();
  const P=G.players;
  if(cur.phase==="ask"){
    const p=P[G.turn];
    if(k===0){award(G.turn,1);cur.scorer=G.turn;cur.outcome="correct";p.streak++;p.best=Math.max(p.best,p.streak);finish();return}
    p.streak=0; cur.timeout=k<0; if(k>=0) cur.wrong.push(k);
    nope();
    if(cfg.steal&&P.length>1){
      cur.phase="steal"; cur.stealer=(G.turn+1)%P.length;
      renderPlay(false); sfx.steal(); startTimer(cfg.timer?Math.min(20,cfg.timer):0); renderBoard(); return;
    }
    cur.outcome=k<0?"timeUp":"wrong"; finish(); return;
  }
  /* steal phase */
  if(k===0){const s=P[cur.stealer];award(cur.stealer,1);cur.scorer=cur.stealer;cur.outcome="stole";s.streak++;s.best=Math.max(s.best,s.streak);finish();return}
  if(k>=0) cur.wrong.push(k);
  nope(); cur.outcome="wrong"; finish();
}
function skipSteal(){if(cur&&cur.phase==="steal"){stopTimer();cur.outcome=cur.timeout?"timeUp":"wrong";finish()}}
function nope(){const sp=$("spec");sp.classList.remove("nope");void sp.offsetWidth;sp.classList.add("nope");sfx.wrong();if(navigator.vibrate)try{navigator.vibrate(120)}catch(e){}}
function finish(){
  stopTimer();
  cur.phase="done"; cur.b.done=true; cur.b.by=cur.scorer; cur.touch=true; cur.look=true;
  renderPlay(false);
  const sp=$("spec"); sp.classList.add("open"); sparks();
  setTimeout(()=>sfx.reveal(),60);
  if(cur.scorer>=0){
    setTimeout(()=>{sfx.right();confetti(110)},350);
    const s=G.players[cur.scorer]; if(s.streak>=2) setTimeout(()=>combo(s),1200);
  }
  renderBoard();
  const r=$("result"); setTimeout(()=>{if(r.classList.contains("on")) r.scrollIntoView({behavior:"smooth",block:"nearest"})},1000);
}
function sparks(){
  const box=$("sparks"); box.innerHTML="";

}

}
function renderResult(){

function closeModal(){stopTimer();stopTyping();$("mPlay").classList.remove("on");document.body.classList.remove("modal-open");cur=null}
function backToBoard(){if(cur&&cur.phase==="ask"&&!cur.wrong.length){closeModal();sfx.click();renderBoard()}}

let endTimers=[];
function clearEndTimers(){endTimers.forEach(clearTimeout);endTimers=[]}
function endGame(){if(!G) return; if(cur) closeModal(); show("sEnd"); renderEnd(true)}
function renderEnd(anim){
  clearEndTimers();
  const P=G.players, ranked=[...P].sort((a,b)=>b.score-a.score);
  ranked.forEach((p,i)=>p._r=i>0&&p.score===ranked[i-1].score?ranked[i-1]._r:i+1);
  const top=ranked.filter(p=>p._r===1), tie=top.length>1;

  $("endSub").innerHTML=tie?top.map(p=>p.av+" "+pName(p)).join(" · "):tx(G.players.length&&top[0].members.length?"champs":"champ");
  const slots=[[ranked[1],"p2"],[ranked[0],"p1"],[ranked[2],"p3"]].filter(s=>s[0]);

     <div class="pav">${p._r===1?'<span class="crown">👑</span>':""}${p.av}</div><div class="pnm">${pName(p,true)}</div>
     ${p.members.length?`<div class="pmem" dir="auto">${p.members.map(esc).join(" · ")}</div>`:""}<div class="ppt">${p.score}</div><div class="pblock">${p._r}</div></div>`).join("");
  $("rest").innerHTML=ranked.slice(3).map((p,i)=>`<div class="rrow" style="--c:${p.color};animation-delay:${(anim?2.6:0)+i*.12}s"><span class="rk">${p._r}</span><span>${p.av}</span><span class="nm">${pName(p)}</span><b>${p.score}</b></div>`).join("");
  const best=[...P].sort((a,b)=>b.best-a.best)[0];
  $("stats").innerHTML=best&&best.best>=2?`<div>🔥 ${txi("bestStreak")}</div><div><b>${best.av} ${pName(best)}</b> <bdi dir="ltr">×${best.best}</bdi></div>`:"";
  const cols={p3:$("podium").querySelector(".p3"),p2:$("podium").querySelector(".p2"),p1:$("podium").querySelector(".p1")};
  const drum=$("drum"), et=$("endTitle"), es=$("endSub");
  if(!anim){drum.classList.remove("on");et.classList.add("on");es.classList.add("on");Object.values(cols).forEach(c=>c&&c.classList.add("up"));return}
  et.classList.remove("on"); es.classList.remove("on");
  drum.innerHTML=tx("drum"); drum.classList.add("on"); sfx.drum();
  const T=(fn,ms)=>endTimers.push(setTimeout(fn,ms));
  T(()=>{cols.p3&&cols.p3.classList.add("up");sfx.pop()},500);
  T(()=>{cols.p2&&cols.p2.classList.add("up");sfx.pop()},1100);
  T(()=>{drum.classList.remove("on");et.classList.add("on");es.classList.add("on");cols.p1&&cols.p1.classList.add("up");sfx.fanfare();confetti(320)},1900);
  for(let i=0;i<7;i++) T(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.3),COLORS[i%COLORS.length]);sfx.pop()},2300+i*380);
}

/* ============================== KEYBOARD ============================== */
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.target&&e.target.matches&&e.target.matches("input,textarea")) return;
  const c=e.code;
  if(c==="KeyF"){toggleFS();e.preventDefault();return}
  if($("sTitle").classList.contains("on")&&(c==="Enter"||c==="NumpadEnter"||c==="Space")){e.preventDefault();toSetup();return}
  if(!cur||!$("mPlay").classList.contains("on")) return;
  const m=c.match(/^(?:Digit|Numpad)([1-4])$/);
  if(m){e.preventDefault();answerPos(+m[1]-1)}
  else if(c==="KeyT") clue("touch");
  else if(c==="KeyL") clue("look");
  else if(c==="KeyA") showWhy();
  else if(c==="Escape") backToBoard();
  else if(c==="Enter"||c==="NumpadEnter"){e.preventDefault();if(cur.phase==="done") nextTurn()}
});
function toggleFS(){
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d)?.catch?.(()=>{})}
    else (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }catch(e){}
}
/* tilt on boxes (mouse only, purely decorative) */
$("board").addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse") return;
  const el=e.target.closest(".mbox:not(.done)"); if(!el) return;
  const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
  el.style.setProperty("--rx",(-y*18)+"deg"); el.style.setProperty("--ry",(x*20)+"deg");
  el.style.setProperty("--mx",(x+.5)*100+"%"); el.style.setProperty("--my",(y+.5)*100+"%");
});
$("board").addEventListener("pointerout",e=>{
  const el=e.target.closest(".mbox"); if(el&&!el.contains(e.relatedTarget)){el.style.removeProperty("--rx");el.style.removeProperty("--ry")}
});

/* ============================== SOUND ============================== */
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==="suspended") AC.resume().catch(()=>{});
  return AC;
}
function tone(f,d=.12,v=.07,type="triangle",when=0,slide=0){
  if(muted||!AC) return;
  try{const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}
}
function noise(d=.3,v=.06,f0=600,f1=3000,when=0){
  if(muted||!AC) return;
  try{const t0=AC.currentTime+when,len=Math.max(1,AC.sampleRate*d|0),buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;f.type="bandpass";f.Q.value=1.2;
    f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+d);
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    s.connect(f).connect(g).connect(AC.destination);s.start(t0);s.stop(t0+d+.02)}catch(e){}
}

  blip:()=>tone(1500+Math.random()*500,.025,.012,"square"),
  flip:()=>{noise(.16,.05,2400,700);tone(900,.08,.03,"sine",0,1300)},
  tick:()=>tone(980,.05,.05,"square"),
  wrong:()=>{tone(240,.32,.07,"sawtooth",0,120);tone(180,.3,.04,"square",.05,90)},
  right:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.24,.08,"triangle",i*.08)),
  reveal:()=>{noise(.6,.06,300,5000);[880,1175,1568].forEach((f,i)=>tone(f,.45,.04,"sine",.15+i*.06))},
  bonus:()=>[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.26,.06,"sine",i*.07)),

};
const SVG_ON='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SVG_OFF='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

/* ============================== VISUAL FX ============================== */
const fx=$("fx"), fxc=fx.getContext("2d"); let parts=[], fxRun=false;
const PAL=["#ffcc4d","#ff4fd8","#34e7ff","#8b5cf6","#3cf2a5","#ffffff","#ff8a5b"];
function confetti(n,x=innerWidth/2,y=innerHeight*.35){
  for(let i=0;i<n;i++) parts.push({k:0,x,y,vx:(Math.random()-.5)*20,vy:-Math.random()*17-4,s:6+Math.random()*7,c:PAL[i%PAL.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:150+Math.random()*50});
  runFx();
}
function burst(x,y,col){
  for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;parts.push({k:1,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:Math.random()<.3?"#fff":col,life:60+Math.random()*30,max:90})}
  runFx();
}
function runFx(){if(!fxRun){fxRun=true;requestAnimationFrame(fxTick)}}
function fxTick(){
  fxc.clearRect(0,0,fx.width,fx.height);
  for(const p of parts){
    p.life--;
    if(p.k===0){p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.fillStyle=p.c;fxc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fxc.restore()}
    else{p.vy+=.05;p.vx*=.97;p.vy*=.97;p.x+=p.vx;p.y+=p.vy;fxc.globalAlpha=Math.max(0,p.life/p.max);fxc.fillStyle=p.c;fxc.beginPath();fxc.arc(p.x,p.y,2.2,0,6.283);fxc.fill();fxc.globalAlpha=1}
  }
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+60);
  if(parts.length) requestAnimationFrame(fxTick); else {fxRun=false;fxc.clearRect(0,0,fx.width,fx.height)}
}
/* animated star / particle background */
const bg=$("bg"), bgc=bg.getContext("2d"); let stars=[], dots=[];
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvases(){
  fx.width=innerWidth; fx.height=innerHeight; bg.width=innerWidth; bg.height=innerHeight;
  const A=innerWidth*innerHeight;
  stars=Array.from({length:Math.min(170,A/8000|0)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,t:Math.random()*6.3,s:.008+Math.random()*.03}));
  dots=Array.from({length:Math.min(42,A/28000|0)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,c:["52,231,255","255,79,216","139,92,246"][Math.random()*3|0]}));
  if(RM) drawBg();
}
function drawBg(){
  const W=bg.width,H=bg.height; bgc.clearRect(0,0,W,H);
  for(const s of stars){s.t+=s.s;bgc.globalAlpha=.25+.65*Math.abs(Math.sin(s.t));bgc.fillStyle="#fff";bgc.beginPath();bgc.arc(s.x,s.y,s.r,0,6.283);bgc.fill()}
  bgc.globalAlpha=1;
  for(let i=0;i<dots.length;i++){const a=dots[i];
    if(!RM){a.x+=a.vx;a.y+=a.vy;if(a.x<0)a.x=W;if(a.x>W)a.x=0;if(a.y<0)a.y=H;if(a.y>H)a.y=0}
    for(let j=i+1;j<dots.length;j++){const b=dots[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
      if(d<19600){bgc.strokeStyle=`rgba(${a.c},${(1-Math.sqrt(d)/140)*.22})`;bgc.lineWidth=1;bgc.beginPath();bgc.moveTo(a.x,a.y);bgc.lineTo(b.x,b.y);bgc.stroke()}}
    bgc.fillStyle=`rgba(${a.c},.85)`;bgc.shadowColor=`rgb(${a.c})`;bgc.shadowBlur=10;bgc.beginPath();bgc.arc(a.x,a.y,2,0,6.283);bgc.fill();bgc.shadowBlur=0;
  }
}
function bgLoop(){if(!document.hidden) drawBg(); requestAnimationFrame(bgLoop)}
addEventListener("resize",sizeCanvases); sizeCanvases(); if(!RM) requestAnimationFrame(bgLoop);

  f.innerHTML=ic.map((e,i)=>`<span style="left:${(i*7.1+Math.random()*4)%96}%;width:${44+Math.random()*34|0}px;animation-duration:${16+Math.random()*16}s;animation-delay:${-Math.random()*30}s">${e}</span>`).join("")})();
